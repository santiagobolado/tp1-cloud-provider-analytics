  <text class="s" x="794" y="406">cassandra-driver · upsert</text>
  <text class="i" x="794" y="422">streaming carga primero,</text>
  <text class="i" x="794" y="435">el reconciliado lo pisa</text>
  <text class="i" x="794" y="458">D-017 · D-018 · D-024</text>

