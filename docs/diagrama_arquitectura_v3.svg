  <rect class="col" x="20" y="614" width="1140" height="172" rx="6"/>
  <text x="32" y="636" font-size="13" font-weight="700" fill="#434d6b">CAPACIDADES TRANSVERSALES — implementadas y verificables (docs/gobierno.md)</text>
  <text class="s" x="32" y="660"><tspan font-weight="700">Calidad:</tspan> controles en cada frontera · quarantine con motivo · invariantes entre columnas · conservación de filas y cuadre de totales que detienen el job</text>
  <text class="s" x="32" y="682"><tspan font-weight="700">Metadatos:</tspan> catálogo como código (src/governance/catalog.py) · diccionario de 39 datasets y 447 columnas · test que falla si una columna no está documentada</text>
  <text class="s" x="32" y="704"><tspan font-weight="700">Linaje:</tspan> source_file · ingest_ts · silver_ts · batch_id · last_reconciled_at · trazado de una anomalía de Gold hasta la línea de Landing</text>
  <text class="s" x="32" y="726"><tspan font-weight="700">Gobierno y seguridad:</tspan> responsables R1–R4 por dataset · retención declarada · credenciales por entorno o Colab Secrets · test anti-secretos · email solo en Bronze</text>
  <text class="s" x="32" y="748"><tspan font-weight="700">Mínimo privilegio:</tspan> token de administrador solo para la carga · token de solo lectura para las consultas, verificado en cada corrida (D-025)</text>
  <text class="s" x="32" y="770"><tspan font-weight="700">Observabilidad:</tspan> log JSON por corrida (filas, rechazos por regla, rutas, bytes, duración) · tardíos y latencia por micro-lote · latencia por consulta</text>
