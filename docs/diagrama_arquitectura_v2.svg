  <path class="ln" d="M180,324 L216,324" marker-end="url(#a)"/>
  <path class="ln" d="M356,178 L392,140" marker-end="url(#a)"/>
  <path class="ln" d="M356,324 L392,152" marker-end="url(#a)"/>
  <path class="ln" d="M570,172 L570,182" marker-end="url(#a)"/>
  <path class="ln" d="M570,268 L570,278" marker-end="url(#a)"/>
  <path class="ln" d="M748,320 L784,250" marker-end="url(#a)"/>
  <path class="ln" d="M748,350 L784,290" marker-end="url(#a)"/>
  <path class="ln" d="M958,200 L994,190" marker-end="url(#a)"/>

  <!-- quarantine -->
  <rect class="store" x="392" y="424" width="356" height="56" rx="4"/>
  <text class="ty" x="404" y="443">QUARANTINE</text>
  <text class="s" x="404" y="459">Bronze: rechazo con motivo (esquema, clave nula o repetida)</text>
  <text class="s" x="404" y="473">Silver: copia de auditoría (value_nulo 877 · unit_nulo_con_value 2.038)</text>
  <path class="ly" d="M392,128 L386,128 L386,452 L392,452" marker-end="url(#ay)"/>
  <path class="ly" d="M392,226 L386,226"/>

  <!-- pendiente -->
  <rect class="pend" x="772" y="424" width="388" height="96" rx="4"/>
  <text class="tp" x="784" y="443">PENDIENTE · entrega final · no implementado</text>
  <text class="sp" x="784" y="461">Marts: revenue_by_org_month (P4) · tickets_by_org_date (P3)</text>
  <text class="sp" x="784" y="475">genai_tokens_by_org_date (P5) · consultas 3 a 5 en AstraDB</text>
  <text class="sp" x="784" y="489">Consumo de Soporte y Producto · componente P7 (A-09)</text>
  <text class="sp" x="784" y="503">Token de solo lectura para consumo · MAD con ventana móvil</text>

  <!-- ejecución -->
  <rect class="green" x="20" y="424" width="348" height="96" rx="4"/>
  <text class="tg" x="32" y="443">EJECUCIÓN Y REPRODUCIBILIDAD</text>
  <text class="s" x="32" y="461">Google Colab · PySpark 4.2.0 local[*] · Java 17 (S-01)</text>
  <text class="m" x="32" y="477">python -m src.pipeline --reset</text>
  <text class="s" x="32" y="493">notebooks/00_pipeline_colab.ipynb · 47 tests</text>
  <text class="s" x="32" y="509">2 corridas desde cero: variación 0 en 12 tablas (O4, O7)</text>

  <rect class="green" x="392" y="490" width="356" height="30" rx="4"/>
  <text class="s" x="404" y="509">Checkpoints fuera de las zonas: _checkpoints/ (no son dato)</text>

  <!-- transversales -->
  <rect class="col" x="20" y="536" width="1140" height="148" rx="6"/>
  <text x="32" y="558" font-size="13" font-weight="700" fill="#434d6b">CAPACIDADES TRANSVERSALES — implementadas y verificables (docs/gobierno.md)</text>
  <text class="s" x="32" y="582"><tspan font-weight="700">Calidad:</tspan> 13 controles por frontera · quarantine con motivo · conservación de filas y cuadre de costo que detienen el job</text>
  <text class="s" x="32" y="602"><tspan font-weight="700">Metadatos:</tspan> catálogo como código (src/governance/catalog.py) · diccionario de 25 datasets y 292 columnas · test que falla si una columna no está documentada</text>
  <text class="s" x="32" y="622"><tspan font-weight="700">Linaje:</tspan> source_file · ingest_ts · silver_ts · batch_id · last_reconciled_at · trazado de una anomalía de Gold hasta la línea de Landing</text>
  <text class="s" x="32" y="642"><tspan font-weight="700">Gobierno y seguridad:</tspan> responsables R1–R4 por dataset · retención declarada · credenciales por entorno o Colab Secrets · test anti-secretos · email solo en Bronze</text>
  <text class="s" x="32" y="662"><tspan font-weight="700">Observabilidad:</tspan> log JSON por corrida (filas, rechazos por regla, rutas, bytes, duración) · tardíos y latencia por micro-lote (mediana ≈ 1 s, O1)</text>
</svg>
