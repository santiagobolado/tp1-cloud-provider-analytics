  <rect width="1180" height="700" fill="#fff"/>
  <text x="20" y="32" font-size="20" font-weight="700" fill="#1f2433">Cloud Provider Analytics — Arquitectura v2 · implementada</text>
  <text x="20" y="52" font-size="12" fill="#5d6477">Patrón híbrido (D-004): streaming de eventos + batch de maestros + reconciliación · verificado end-to-end en AstraDB · 2026-11-13</text>

  <!-- columnas -->
  <rect class="col" x="20" y="70" width="172" height="340" rx="6"/>
  <text class="h" x="106" y="90">LANDING</text>
  <text class="i" x="106" y="104" text-anchor="middle">crudo inmutable · data/landing</text>
  <rect class="col" x="204" y="70" width="164" height="340" rx="6"/>
  <text class="h" x="286" y="90">INGESTA</text>
  <rect class="lake" x="380" y="70" width="380" height="340" rx="6"/>
  <text class="hl" x="570" y="90">DATA LAKE · Parquet particionado</text>
  <rect class="col" x="772" y="70" width="198" height="340" rx="6"/>
  <text class="h" x="871" y="90">SERVING</text>
  <rect class="col" x="982" y="70" width="178" height="340" rx="6"/>
  <text class="h" x="1071" y="90">CONSUMO</text>

  <!-- landing -->
  <rect class="box" x="32" y="114" width="148" height="128" rx="4"/>
  <text class="tc" x="106" y="132">Maestros y hechos</text>
  <text class="s" x="42" y="150">customers_orgs · users</text>
  <text class="s" x="42" y="164">resources · support_tickets</text>
  <text class="s" x="42" y="178">marketing_touches</text>
  <text class="s" x="42" y="192">nps_surveys</text>
  <text class="s" x="42" y="206">billing_monthly</text>
  <text class="i" x="42" y="228">7 CSV · 4.112 filas</text>

  <rect class="box" x="32" y="254" width="148" height="140" rx="4"/>
  <text class="tc" x="106" y="272">Eventos de uso</text>
  <text class="m" x="42" y="290">usage_events_stream/</text>
  <text class="m" x="42" y="303">*.jsonl</text>
  <text class="s" x="42" y="322">120 archivos</text>
  <text class="s" x="42" y="336">43.200 eventos · v1 y v2</text>
  <text class="i" x="42" y="356">cada archivo cubre</text>
  <text class="i" x="42" y="369">59–60 días, sin orden</text>
  <text class="i" x="42" y="382">(A-07 cerrada, D-012)</text>

  <!-- ingesta -->
  <rect class="box" x="216" y="114" width="140" height="128" rx="4"/>
  <text class="tc" x="286" y="132">Batch</text>
  <text class="m" x="226" y="149">batch_to_bronze</text>
  <text class="s" x="226" y="166">esquema explícito</text>
  <text class="s" x="226" y="180">dedupe: 1.ª aparición</text>
  <text class="s" x="226" y="194">overwrite dinámico</text>
  <text class="s" x="226" y="208">por ingest_date</text>
  <text class="i" x="226" y="228">D-011</text>

  <rect class="box" x="216" y="254" width="140" height="140" rx="4"/>
  <text class="tc" x="286" y="272">Streaming</text>
  <text class="m" x="226" y="289">stream_to_bronze</text>
  <text class="s" x="226" y="306">1 archivo / micro-lote</text>
  <text class="s" x="226" y="320">watermark 7 d</text>
  <text class="s" x="226" y="334">sobre ingest_ts</text>
  <text class="s" x="226" y="348">dedupe por event_id</text>
  <text class="s" x="226" y="362">checkpoint</text>
  <text class="i" x="226" y="382">D-013 · 0 perdidos</text>

  <!-- lake -->
  <rect class="zone" x="392" y="104" width="356" height="68" rx="4"/>
  <text class="t" x="404" y="122">BRONZE</text>
  <text class="i" x="736" y="122" text-anchor="end">partición: ingest_date</text>
  <text class="s" x="404" y="140">8 tablas · mismo grano que la fuente · tipado explícito</text>
  <text class="s" x="404" y="155">source_file · ingest_ts · 43.200 eventos · 0 rechazos</text>

  <rect class="zone" x="392" y="182" width="356" height="86" rx="4"/>
  <text class="t" x="404" y="200">SILVER</text>
  <text class="i" x="736" y="200" text-anchor="end">event_date · service</text>
  <text class="s" x="404" y="218">usage_events: cast con fallback · v1/v2 · join org · 6 features</text>
  <text class="s" x="404" y="233">customers_orgs (NPS resuelto, D-006) · resources (tags)</text>
  <text class="s" x="404" y="248">quality_flags: 3.117 marcadas · 0 descartadas · unit imputada</text>
  <text class="i" x="404" y="262">D-009 · D-014</text>

  <rect class="zone" x="392" y="278" width="356" height="120" rx="4"/>
  <text class="t" x="404" y="296">GOLD</text>
  <text class="m" x="404" y="315">org_daily_usage_by_service</text>
  <text class="s" x="404" y="329">oficial · flujo D: reconciliación desde Silver · 11.050 filas</text>
  <text class="m" x="404" y="347">org_daily_usage_by_service_speed</text>
  <text class="s" x="404" y="361">provisorio · flujo C: streaming, watermark 7 d en event_ts</text>
  <text class="m" x="404" y="379">cost_anomaly_mart</text>
  <text class="s" x="530" y="379">MAD por serie · 130 anomalías · 54/54 picos</text>
  <text class="i" x="404" y="393">D-015 · D-016 · tardíos: 36.808 (85,2 %), recuperados por D</text>

  <!-- serving -->
  <rect class="store" x="784" y="114" width="174" height="230" rx="4"/>
  <text class="tc" x="871" y="134" fill="#8a6508">AstraDB</text>
  <text class="s" x="794" y="151">keyspace cloud_analytics</text>
  <text class="m" x="794" y="173">org_daily_usage_by_</text>
  <text class="m" x="794" y="185">service</text>
  <text class="s" x="794" y="200">PK ((org_id), usage_date,</text>
  <text class="s" x="794" y="213">service) · 11.050 filas</text>
  <text class="m" x="794" y="235">top_services_by_org_14d</text>
  <text class="s" x="794" y="250">PK ((org_id, as_of_date),</text>
  <text class="s" x="794" y="263">rank) · 12.314 filas</text>
  <text class="s" x="794" y="285">cassandra-driver · upsert</text>
  <text class="i" x="794" y="303">streaming carga primero,</text>
  <text class="i" x="794" y="316">el reconciliado lo pisa</text>
  <text class="i" x="794" y="334">D-017</text>

  <!-- consumo -->
  <rect class="box" x="994" y="114" width="154" height="150" rx="4"/>
  <text class="tc" x="1071" y="132">FinOps</text>
  <text class="s" x="1004" y="152">Q1 · P1: costo y requests</text>
  <text class="s" x="1004" y="166">por día en un rango</text>
  <text class="i" x="1004" y="180">39 ms (O6: &lt; 1 s)</text>
  <text class="s" x="1004" y="202">Q2 · P2: Top-N servicios</text>
  <text class="s" x="1004" y="216">en 14 días</text>
  <text class="i" x="1004" y="230">38 ms</text>
  <text class="s" x="1004" y="252">P6: anomalías en Gold</text>

  <!-- flechas principales -->
