    <marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b8860b"/>
    </marker>
    <style>
      .col{fill:#f6f7fb;stroke:#c9cedb;stroke-width:1}
      .lake{fill:#eef4ff;stroke:#7d98c4;stroke-width:1}
